apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.jarvis.call'
    compileSdk 34

    defaultConfig {
        applicationId "com.jarvis.call"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0-debug"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// kotlin-stdlib-jdk7/jdk8 (1.6.0) duplicate the classes already in
// kotlin-stdlib 1.8.22 and break :app:checkDebugDuplicateClasses, so
// exclude them; the classes are still provided by kotlin-stdlib itself.
configurations {
    all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
}
